---
name: "unit tests - all"
on:
  pull_request:
  push:
    branches:
      - "main"
jobs:
  unit-tests:
    name: "Unit Tests - Python ${{ matrix.python-version }} -- ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: "check out repository"
        uses: "actions/checkout@v4"
        with:
          submodules: 'true'
      - name: "set up python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "cache pip packages"
        uses: "actions/cache@v4"
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: "install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "run unit tests"
        run: |
          pytest -c pytest.ini -m unit --cov=src/koios_api --cov-report=term-missing --cov-report=xml
      - name: "upload coverage to codecov"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    name: "Integration Tests - Python ${{ matrix.python-version }} -- ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]
    steps:
      - name: "check out repository"
        uses: "actions/checkout@v4"
        with:
          submodules: 'true'
      - name: "set up python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "cache pip packages"
        uses: "actions/cache@v4"
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: "install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "run integration tests"
        run: |
          pytest -c pytest.ini -m integration --cov=src/koios_api --cov-report=term-missing --cov-report=xml
      - name: "upload coverage to codecov"
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integrationtests
          name: codecov-umbrella
          fail_ci_if_error: false
